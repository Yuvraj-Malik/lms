[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API/upload requests to the Render backend so cookies stay first-party
# (replace with your actual Render service URL after it's created)
[[redirects]]
  from = "/api/*"
  to = "https://lms-39xs.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://lms-39xs.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (e.g. /dashboard) resolve on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


